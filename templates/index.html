<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaliBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

  <style>
    /* ---------- SaliBot colours ---------- */
    :root {
      --bg: #0e1016;
      --panel: #151821;
      --panel-2: #1c2030;
      --border: #272c3d;
      --text: #e8eaf2;
      --muted: #8b91a7;
      --violet: #8b5cf6;
      --teal: #2dd4bf;
      --accent: linear-gradient(135deg, var(--violet), var(--teal));
      --user-bubble: #2a2350;
      --danger: #f87171;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body { display: flex; overflow: hidden; }

    button { font-family: inherit; cursor: pointer; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      gap: 14px;
      transition: transform .25s ease;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--accent);
      display: grid;
      place-items: center;
      font-size: 20px;
      box-shadow: 0 6px 20px rgba(139, 92, 246, .35);
    }

    .brand-name { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
    .brand-tag  { font-size: 12px; color: var(--muted); }

    .new-chat {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: border-color .2s, background .2s;
    }
    .new-chat:hover { border-color: var(--violet); background: #221d3a; }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 8px 0;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .conversation {
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: .82;
    }
    .conversation:hover { background: var(--panel-2); opacity: 1; }
    .conversation.active {
      background: var(--panel-2);
      opacity: 1;
      box-shadow: inset 3px 0 0 var(--violet);
    }

    .empty-list { color: var(--muted); font-size: 13px; padding: 8px 10px; }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    .sidebar-footer strong {
      background: var(--accent);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* ---------- Main area ---------- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 22px;
      padding: 2px 6px;
    }

    .topbar-title { font-weight: 600; font-size: 15px; }

    .status {
      margin-left: auto;
      font-size: 12.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
    }
    .status.busy::before { background: var(--violet); animation: pulse 1s infinite; }

    @keyframes pulse { 50% { opacity: .3; } }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 26px 22px 10px;
    }

    .chat-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Welcome screen */
    .welcome {
      text-align: center;
      margin-top: 8vh;
    }
    .welcome .logo {
      width: 64px;
      height: 64px;
      font-size: 32px;
      border-radius: 20px;
      margin: 0 auto 18px;
    }
    .welcome h1 {
      font-size: clamp(26px, 4vw, 34px);
      margin: 0 0 8px;
      letter-spacing: -.6px;
    }
    .welcome p { color: var(--muted); margin: 0 0 28px; }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      text-align: left;
    }

    .suggestion {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.4;
      transition: border-color .2s, transform .2s;
    }
    .suggestion:hover { border-color: var(--violet); transform: translateY(-2px); }
    .suggestion span { display: block; font-size: 20px; margin-bottom: 6px; }
    .suggestion small { display: block; color: var(--muted); margin-top: 2px; }

    /* Messages */
    .message { display: flex; gap: 12px; align-items: flex-start; }
    .message.user { justify-content: flex-end; }

    .avatar {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 10px;
      background: var(--accent);
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .bubble {
      max-width: 100%;
      min-width: 0;
      line-height: 1.65;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      padding: 11px 16px;
      border-radius: var(--radius) var(--radius) 4px var(--radius);
      max-width: 80%;
      white-space: pre-wrap;
    }

    .message.bot .bubble { padding-top: 4px; flex: 1; }

    .bubble p { margin: 0 0 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h1, .bubble h2, .bubble h3 { margin: 16px 0 8px; line-height: 1.3; }
    .bubble h1 { font-size: 21px; }
    .bubble h2 { font-size: 18px; }
    .bubble h3 { font-size: 16px; }
    .bubble ul, .bubble ol { padding-left: 22px; margin: 6px 0 10px; }
    .bubble li { margin: 3px 0; }
    .bubble a { color: var(--teal); }
    .bubble hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .bubble code {
      font-family: "JetBrains Mono", Consolas, monospace;
      background: var(--panel-2);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 13px;
    }
    .bubble pre {
      background: #0a0c12;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      overflow-x: auto;
    }
    .bubble pre code { background: none; padding: 0; }
    .bubble table { border-collapse: collapse; margin: 8px 0; display: block; overflow-x: auto; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; }

    .system-note {
      align-self: center;
      font-size: 13px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
    }
    .system-note.error { color: var(--danger); border-color: rgba(248, 113, 113, .4); }

    .tool-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--teal);
      background: rgba(45, 212, 191, .08);
      border: 1px solid rgba(45, 212, 191, .25);
      border-radius: 999px;
      padding: 4px 11px;
      margin: 0 6px 10px 0;
    }

    .typing { display: inline-flex; gap: 5px; padding: 8px 0; }
    .typing i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }

    /* ---------- Input area ---------- */
    .composer-wrap { padding: 10px 22px 16px; }

    .composer {
      max-width: 780px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 10px 10px 14px;
      transition: border-color .2s;
    }
    .composer:focus-within { border-color: var(--violet); }

    #messageInput {
      width: 100%;
      background: none;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      max-height: 200px;
      padding: 4px 2px 8px;
    }
    #messageInput::placeholder { color: var(--muted); }

    .composer-row { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 17px;
      display: grid;
      place-items: center;
      transition: border-color .2s;
    }
    .icon-btn:hover { border-color: var(--violet); }
    .icon-btn.recording {
      background: rgba(248, 113, 113, .15);
      border-color: var(--danger);
      animation: pulse 1s infinite;
    }

    #modelSelect {
      margin-left: auto;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 10px;
      font: inherit;
      font-size: 13px;
      max-width: 190px;
    }

    #sendBtn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-size: 18px;
      font-weight: 700;
    }
    #sendBtn:disabled { opacity: .4; cursor: not-allowed; }

    .notice {
      max-width: 780px;
      margin: 8px auto 0;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
    }

    .overlay { display: none; }

    /* ---------- Phones ---------- */
    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        transform: translateX(-100%);
        box-shadow: 10px 0 40px rgba(0, 0, 0, .5);
      }
      body.sidebar-open .sidebar { transform: translateX(0); }
      body.sidebar-open .overlay {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .5);
        z-index: 10;
      }
      .menu-btn { display: block; }
      .topbar, .chat, .composer-wrap { padding-left: 16px; padding-right: 16px; }
      .suggestions { grid-template-columns: 1fr; }
      .message.user .bubble { max-width: 90%; }
      #modelSelect { max-width: 130px; }
    }
  </style>
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🤖</div>
      <div>
        <div class="brand-name">SaliBot</div>
        <div class="brand-tag">Your friendly AI companion</div>
      </div>
    </div>

    <button class="new-chat" id="newChatBtn">＋ New chat</button>

    <div class="section-title">Recent chats</div>
    <div class="conversation-list" id="conversationList"></div>

    <div class="sidebar-footer">Built by <strong>Salima</strong> · Powered by Gemini</div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open chats">☰</button>
      <div class="topbar-title" id="chatTitle">New chat</div>
      <div class="status" id="status">Ready</div>
    </header>

    <section class="chat" id="chatContainer">
      <div class="chat-inner" id="chatInner"></div>
    </section>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="messageInput" rows="1" placeholder="Ask SaliBot anything..."></textarea>
        <div class="composer-row">
          <button class="icon-btn" id="attachBtn" title="Upload a document or picture">📎</button>
          <input type="file" id="fileInput" hidden
                 accept=".pdf,.docx,.txt,.md,.py,.csv,.xlsx,.pptx,.png,.jpg,.jpeg,.webp">
          <button class="icon-btn" id="micBtn" title="Speak your message">🎤</button>
          <select id="modelSelect" title="Choose a Gemini model"></select>
          <button id="sendBtn" title="Send">↑</button>
        </div>
      </div>
      <div class="notice" id="noticeText">SaliBot can make mistakes. Double-check important information.</div>
    </div>
  </main>

  <script>
    // ---------- Page elements ----------
    const chatContainer = document.getElementById("chatContainer");
    const chatInner = document.getElementById("chatInner");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("status");
    const conversationList = document.getElementById("conversationList");
    const modelSelect = document.getElementById("modelSelect");
    const noticeText = document.getElementById("noticeText");
    const micBtn = document.getElementById("micBtn");
    const attachBtn = document.getElementById("attachBtn");
    const fileInput = document.getElementById("fileInput");
    const chatTitle = document.getElementById("chatTitle");
    const DEFAULT_NOTICE = noticeText.textContent;

    const TOOL_LABELS = {
      tavily_search: "🌐 Searching the web",
      calculator: "🧮 Calculating",
      search_uploaded_documents: "📄 Reading your documents",
      remember_this: "💾 Saving to memory",
      recall_memory: "🔍 Checking memory"
    };

    const SUGGESTIONS = [
      { icon: "🌐", title: "What's new in robotics today?", hint: "Uses live web search" },
      { icon: "📄", title: "Summarise my uploaded document", hint: "Upload with 📎 first" },
      { icon: "💾", title: "Remember that I teach robotics", hint: "Saved to long-term memory" },
      { icon: "🧮", title: "What is 125 × 48 ÷ 6?", hint: "Uses the calculator tool" }
    ];

    let isBusy = false;

    // ---------- Small helpers ----------
    function safeGet(key) {
      try { return localStorage.getItem(key); } catch { return null; }
    }
    function safeSet(key, value) {
      try { localStorage.setItem(key, value); } catch {}
    }

    function makeId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    let threadId = safeGet("thread_id") || makeId();
    safeSet("thread_id", threadId);

    function renderMarkdown(element, text) {
      if (window.marked && window.DOMPurify) {
        element.innerHTML = DOMPurify.sanitize(marked.parse(text));
      } else {
        element.textContent = text;
        element.style.whiteSpace = "pre-wrap";
      }
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function setBusy(busy, label = "Thinking...") {
      isBusy = busy;
      sendBtn.disabled = busy;
      statusText.textContent = busy ? label : "Ready";
      statusText.classList.toggle("busy", busy);
    }

    function autoResize() {
      messageInput.style.height = "auto";
      messageInput.style.height = Math.min(messageInput.scrollHeight, 200) + "px";
    }

    // ---------- Drawing messages ----------
    function showWelcome() {
      chatInner.innerHTML = `
        <div class="welcome">
          <div class="logo">🤖</div>
          <h1>Hi, I'm SaliBot!</h1>
          <p>Ask questions, upload documents, search the web, and chat with memory.</p>
          <div class="suggestions"></div>
        </div>`;

      const box = chatInner.querySelector(".suggestions");
      SUGGESTIONS.forEach(s => {
        const btn = document.createElement("button");
        btn.className = "suggestion";
        btn.innerHTML = `<span>${s.icon}</span>${s.title}<small>${s.hint}</small>`;
        btn.onclick = () => {
          if (s.icon === "📄") { fileInput.click(); return; }
          messageInput.value = s.title.replace("×", "*").replace("÷", "/");
          sendMessage();
        };
        box.appendChild(btn);
      });
    }

    function clearWelcome() {
      const welcome = chatInner.querySelector(".welcome");
      if (welcome) welcome.remove();
    }

    function addUserMessage(text) {
      clearWelcome();
      const row = document.createElement("div");
      row.className = "message user";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      chatInner.appendChild(row);
      scrollToBottom();
    }

    function addBotMessage(text = "") {
      clearWelcome();
      const row = document.createElement("div");
      row.className = "message bot";
      row.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="tools"></div><div class="content"></div></div>`;
      chatInner.appendChild(row);
      const content = row.querySelector(".content");
      if (text) renderMarkdown(content, text);
      scrollToBottom();
      return row;
    }

    function addNote(text, isError = false) {
      clearWelcome();
      const note = document.createElement("div");
      note.className = "system-note" + (isError ? " error" : "");
      renderMarkdown(note, text);
      chatInner.appendChild(note);
      scrollToBottom();
    }

    // ---------- Talking to the server ----------
    async function loadModels() {
      try {
        const res = await fetch("/models");
        const data = await res.json();
        modelSelect.innerHTML = "";
        data.models.forEach(m => {
          const option = document.createElement("option");
          option.value = m;
          option.textContent = m;
          modelSelect.appendChild(option);
        });
        const saved = safeGet("selected_model");
        modelSelect.value = data.models.includes(saved) ? saved : data.default;
      } catch (e) {
        noticeText.textContent = "Couldn't load models — is the server running?";
      }
    }

    async function loadConversations() {
      try {
        const res = await fetch("/conversations");
        const chats = await res.json();
        conversationList.innerHTML = "";

        if (!chats.length) {
          conversationList.innerHTML = `<div class="empty-list">No chats yet — say hi! 👋</div>`;
          return;
        }

        chats.forEach(chat => {
          const btn = document.createElement("button");
          btn.className = "conversation" + (chat.thread_id === threadId ? " active" : "");
          btn.textContent = chat.title || "New chat";
          btn.title = chat.title || "New chat";
          btn.onclick = () => openConversation(chat.thread_id, chat.title);
          conversationList.appendChild(btn);
          if (chat.thread_id === threadId) chatTitle.textContent = chat.title || "New chat";
        });
      } catch (e) {
        conversationList.innerHTML = `<div class="empty-list">Couldn't load chats.</div>`;
      }
    }

    async function loadHistory() {
      chatInner.innerHTML = "";
      try {
        const res = await fetch(`/history/${encodeURIComponent(threadId)}`);
        const messages = await res.json();

        if (!messages.length) { showWelcome(); return; }

        messages.forEach(m => {
          if (m.role === "user") addUserMessage(m.content);
          else if (m.role === "system") addNote(m.content);
          else addBotMessage(m.content);
        });
      } catch (e) {
        showWelcome();
      }
    }

    async function openConversation(id, title) {
      if (isBusy) return;
      threadId = id;
      safeSet("thread_id", id);
      chatTitle.textContent = title || "New chat";
      document.body.classList.remove("sidebar-open");
      await loadHistory();
      await loadConversations();
    }

    function newChat() {
      if (isBusy) return;
      threadId = makeId();
      safeSet("thread_id", threadId);
      chatTitle.textContent = "New chat";
      showWelcome();
      loadConversations();
      document.body.classList.remove("sidebar-open");
      messageInput.focus();
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || isBusy) return;

      if (isDictating) stopDictation();
      messageInput.value = "";
      autoResize();
      addUserMessage(text);

      const row = addBotMessage();
      const content = row.querySelector(".content");
      const toolsBox = row.querySelector(".tools");
      content.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
      setBusy(true);

      let reply = "";
      let renderQueued = false;
      const queueRender = () => {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => {
          renderMarkdown(content, reply);
          scrollToBottom();
          renderQueued = false;
        });
      };

      try {
        const res = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, thread_id: threadId, model: modelSelect.value })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.trim()) continue;
            const event = JSON.parse(line);

            if (event.type === "token") {
              reply += event.text;
              queueRender();
            } else if (event.type === "tool") {
              const label = TOOL_LABELS[event.name] || `🛠️ Using ${event.name}`;
              const chip = document.createElement("span");
              chip.className = "tool-chip";
              chip.textContent = label;
              toolsBox.appendChild(chip);
              statusText.textContent = label + "...";
            } else if (event.type === "error") {
              reply += `\n\n⚠️ ${event.message}`;
              queueRender();
            }
          }
        }

        if (!reply) content.textContent = "(No reply — please try again.)";
      } catch (e) {
        content.textContent = "⚠️ Couldn't reach SaliBot. Is the server still running?";
      } finally {
        setBusy(false);
        loadConversations();
        messageInput.focus();
      }
    }

    async function uploadFile(file) {
      if (!file || isBusy) return;
      setBusy(true, `Reading ${file.name}...`);
      addNote(`⏳ Uploading **${file.name}**...`);

      const form = new FormData();
      form.append("file", file);
      form.append("thread_id", threadId);

      try {
        const res = await fetch("/upload", { method: "POST", body: form });
        const data = await res.json();
        chatInner.lastElementChild.remove();

        if (!res.ok) {
          addNote(`⚠️ ${data.error || "Upload failed."}`, true);
        } else {
          const chunkWord = data.chunks === 1 ? "chunk" : "chunks";
          addNote(`📎 Uploaded **${data.filename}** (${data.chunks} ${chunkWord}) — ask me about it!`);
        }
      } catch (e) {
        chatInner.lastElementChild.remove();
        addNote("⚠️ Upload failed. Is the server still running?", true);
      } finally {
        setBusy(false);
        fileInput.value = "";
        loadConversations();
      }
    }

    // ---------- 🎤 Voice input (browser speech recognition) ----------
    let isDictating = false;
    let speechRecognition = null;
    let textBeforeDictation = "";

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        return null;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isDictating = true;
        micBtn.classList.add("recording");
        micBtn.textContent = "⏹";
        statusText.textContent = "Listening...";
        textBeforeDictation = messageInput.value ? messageInput.value.trim() + " " : "";
      };

      recognition.onresult = (event) => {
        let finalTranscript = "";
        let interimTranscript = "";

        for (let i = 0; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalTranscript += transcript;
          else interimTranscript += transcript;
        }

        messageInput.value = textBeforeDictation + finalTranscript + interimTranscript;
        autoResize();
        noticeText.textContent = interimTranscript ? "Listening: " + interimTranscript : "Listening...";
      };

      recognition.onerror = (event) => {
        console.error("Speech recognition error:", event.error);
        if (event.error === "not-allowed") {
          alert("Microphone permission denied. Please allow microphone access.");
        }
        stopDictation();
      };

      recognition.onend = () => {
        if (isDictating) {
          try { recognition.start(); } catch { stopDictation(); }
        }
      };

      return recognition;
    }

    function startDictation() {
      if (!speechRecognition) speechRecognition = setupSpeechRecognition();
      if (!speechRecognition) {
        alert("Voice input works in Chrome or Edge. Your browser doesn't support it.");
        return;
      }
      try { speechRecognition.start(); } catch {}
    }

    function stopDictation() {
      isDictating = false;
      if (speechRecognition) {
        try { speechRecognition.stop(); } catch {}
      }
      micBtn.classList.remove("recording");
      micBtn.textContent = "🎤";
      noticeText.textContent = DEFAULT_NOTICE;
      if (!isBusy) statusText.textContent = "Ready";
    }

    // ---------- Buttons & keys ----------
    sendBtn.onclick = sendMessage;
    document.getElementById("newChatBtn").onclick = newChat;
    attachBtn.onclick = () => fileInput.click();
    fileInput.onchange = () => uploadFile(fileInput.files[0]);
    micBtn.onclick = () => (isDictating ? stopDictation() : startDictation());
    modelSelect.onchange = () => safeSet("selected_model", modelSelect.value);
    document.getElementById("menuBtn").onclick = () => document.body.classList.add("sidebar-open");
    document.getElementById("overlay").onclick = () => document.body.classList.remove("sidebar-open");

    messageInput.addEventListener("input", autoResize);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ---------- Start ----------
    loadModels();
    loadConversations();
    loadHistory();
  </script>
</body>
</html>
