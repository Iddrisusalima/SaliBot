<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaliBot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

  <style>
    /* ---------- SaliBot colours ---------- */
    :root {
      --bg: #0d0f15;
      --panel: #13161f;
      --panel-2: #1b1f2b;
      --hover: #222738;
      --border: #262b3b;
      --text: #e8eaf2;
      --muted: #8b91a7;
      --violet: #8b5cf6;
      --teal: #2dd4bf;
      --accent: linear-gradient(135deg, var(--violet), var(--teal));
      --user-bubble: #2a2350;
      --danger: #f87171;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body { display: flex; overflow: hidden; }
    button { font-family: inherit; cursor: pointer; color: inherit; }
    svg { width: 18px; height: 18px; flex-shrink: 0; }

    .icon-only {
      background: none;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      color: var(--muted);
    }
    .icon-only:hover { background: var(--hover); color: var(--text); }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 272px;
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px 10px;
      gap: 4px;
      transition: margin-left .25s ease, transform .25s ease;
      z-index: 20;
    }
    body.sidebar-collapsed .sidebar { margin-left: -272px; }

    .sidebar-head {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 4px 10px;
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--accent);
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -.3px; margin-right: auto; }

    .side-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 14px;
    }
    .side-item:hover { background: var(--hover); }

    .search-box {
      display: none;
      margin: 2px 4px 6px;
    }
    .search-box.open { display: block; }
    .search-box input {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      color: var(--text);
      font: inherit;
      font-size: 13.5px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--violet); }

    .section-title {
      font-size: 12.5px;
      color: var(--muted);
      padding: 18px 10px 6px;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .conversation {
      text-align: left;
      background: transparent;
      border: none;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .conversation:hover { background: var(--hover); }
    .conversation.active { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--violet); }

    .empty-list { color: var(--muted); font-size: 13px; padding: 8px 10px; }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px 4px;
      border-top: 1px solid var(--border);
      margin-top: 6px;
    }
    .avatar-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .profile-name { font-size: 14px; font-weight: 600; }
    .profile-sub { font-size: 12px; color: var(--muted); }

    /* ---------- Main area ---------- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
    }

    .open-sidebar { display: none; }
    body.sidebar-collapsed .open-sidebar { display: grid; }

    .model-picker {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px 4px 10px;
      border-radius: 10px;
    }
    .model-picker:hover { background: var(--hover); }
    .model-picker b { font-size: 16px; }

    #modelSelect {
      align-self: center;
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 10px;
      font: inherit;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      max-width: 190px;
    }
    #modelSelect:hover { color: var(--text); border-color: var(--violet); }
    #modelSelect option { background: var(--panel); color: var(--text); }

    .status {
      margin-left: auto;
      font-size: 12.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
    }
    .status.busy::before { background: var(--violet); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 22px 10px;
    }

    .chat-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Messages */
    .message { display: flex; gap: 12px; align-items: flex-start; }
    .message.user { justify-content: flex-end; }

    .avatar {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--teal);
      color: #06201c;
      display: grid;
      place-items: center;
      font-size: 11.5px;
      font-weight: 700;
    }
    .avatar.you { background: var(--violet); color: #fff; }

    .bubble {
      min-width: 0;
      line-height: 1.65;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      padding: 10px 16px;
      border-radius: 20px;
      max-width: 75%;
      white-space: pre-wrap;
    }

    .message.bot .bubble { padding-top: 3px; flex: 1; }

    .bubble p { margin: 0 0 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h1, .bubble h2, .bubble h3 { margin: 16px 0 8px; line-height: 1.3; }
    .bubble h1 { font-size: 21px; }
    .bubble h2 { font-size: 18px; }
    .bubble h3 { font-size: 16px; }
    .bubble ul, .bubble ol { padding-left: 22px; margin: 6px 0 10px; }
    .bubble li { margin: 3px 0; }
    .bubble a { color: var(--teal); }
    .bubble hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .bubble code {
      font-family: "JetBrains Mono", Consolas, monospace;
      background: var(--panel-2);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 13px;
    }
    .bubble pre {
      background: #090b10;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      overflow-x: auto;
    }
    .bubble pre code { background: none; padding: 0; }
    .bubble table { border-collapse: collapse; margin: 8px 0; display: block; overflow-x: auto; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; }

    .system-note {
      align-self: center;
      font-size: 13px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
    }
    .system-note.error { color: var(--danger); border-color: rgba(248, 113, 113, .4); }

    .tool-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--teal);
      background: rgba(45, 212, 191, .08);
      border: 1px solid rgba(45, 212, 191, .25);
      border-radius: 999px;
      padding: 4px 11px;
      margin: 0 6px 10px 0;
    }

    .typing { display: inline-flex; gap: 5px; padding: 8px 0; }
    .typing i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }

    /* ---------- Input area ---------- */
    .composer-wrap { padding: 8px 22px 14px; }

    .hero {
      display: none;
      text-align: center;
      font-size: clamp(24px, 3.4vw, 30px);
      font-weight: 600;
      letter-spacing: -.5px;
      margin: 0 0 26px;
    }
    .hero span {
      background: var(--accent);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .composer {
      max-width: 760px;
      margin: 0 auto;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 7px 8px 7px 8px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .25);
      transition: border-color .2s;
    }
    .composer:focus-within { border-color: var(--violet); }

    #messageInput {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      max-height: 200px;
      padding: 7px 6px;
    }
    #messageInput::placeholder { color: var(--muted); }

    .round-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: none;
      color: var(--muted);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .round-btn:hover { background: var(--hover); color: var(--text); }
    .round-btn.recording { background: rgba(248, 113, 113, .18); color: var(--danger); animation: pulse 1s infinite; }

    #sendBtn {
      background: var(--accent);
      color: #fff;
    }
    #sendBtn:hover { filter: brightness(1.1); }
    #sendBtn:disabled { opacity: .4; cursor: not-allowed; }

    .suggestions {
      display: none;
      max-width: 760px;
      margin: 18px auto 0;
      flex-direction: column;
      gap: 2px;
    }

    .suggestion {
      display: flex;
      align-items: center;
      gap: 12px;
      background: none;
      border: none;
      text-align: left;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 14.5px;
      color: var(--text);
    }
    .suggestion:hover { background: var(--panel-2); }
    .suggestion svg { color: var(--muted); }
    .suggestion small { color: var(--muted); margin-left: auto; font-size: 12px; }

    .notice {
      max-width: 760px;
      margin: 8px auto 0;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
    }

    /* ---------- Start screen: input in the middle ---------- */
    .main.empty .chat { display: none; }
    .main.empty .composer-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 12vh;
    }
    .main.empty .hero { display: block; }
    .main.empty .suggestions { display: flex; width: 100%; }
    .main.empty .notice { display: none; }
    .main.empty .composer { width: 100%; }

    .overlay { display: none; }

    /* ---------- Phones ---------- */
    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        margin-left: 0 !important;
        transform: translateX(-100%);
        box-shadow: 10px 0 40px rgba(0, 0, 0, .5);
      }
      body.sidebar-open .sidebar { transform: translateX(0); }
      body.sidebar-open .overlay {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .5);
        z-index: 10;
      }
      .open-sidebar { display: grid; }
      .collapse-btn { display: none; }
      .chat, .composer-wrap { padding-left: 14px; padding-right: 14px; }
      .topbar { padding: 8px 10px; }
      .message.user .bubble { max-width: 88%; }
      .suggestion small { display: none; }
      #modelSelect { max-width: 118px; padding: 6px 8px; font-size: 12px; }
    }
  </style>
</head>

<body>
  <!-- Reusable line icons -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
      <symbol id="i-brain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 0 0-5.9.6A3 3 0 0 0 4 11a3 3 0 0 0 2 5.2A3 3 0 0 0 12 18Z"/><path d="M12 5a3 3 0 0 1 5.9.6A3 3 0 0 1 20 11a3 3 0 0 1-2 5.2A3 3 0 0 1 12 18Z"/></symbol>
      <symbol id="i-calc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></symbol>
    </defs>
  </svg>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand-name">SaliBot</div>
      <button class="icon-only" id="searchToggle" title="Search chats"><svg><use href="#i-search"/></svg></button>
      <button class="icon-only collapse-btn" id="collapseBtn" title="Close sidebar"><svg><use href="#i-panel"/></svg></button>
    </div>

    <button class="side-item" id="newChatBtn"><svg><use href="#i-edit"/></svg>New chat</button>
    <button class="side-item" id="uploadSideBtn"><svg><use href="#i-doc"/></svg>Upload a document</button>

    <div class="search-box" id="searchBox">
      <input id="searchInput" type="text" placeholder="Search chats...">
    </div>

    <div class="section-title">Recents</div>
    <div class="conversation-list" id="conversationList"></div>

    <div class="profile">
      <div class="avatar-circle">S</div>
      <div>
        <div class="profile-name">Salima</div>
        <div class="profile-sub">SaliBot · Powered by Gemini</div>
      </div>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main empty" id="main">
    <header class="topbar">
      <button class="icon-only open-sidebar" id="openSidebarBtn" title="Open sidebar"><svg><use href="#i-panel"/></svg></button>
      <div class="model-picker">
        <b>Agentic AI Chatbot</b>
      </div>
      <div class="status" id="status">Ready</div>
    </header>

    <section class="chat" id="chatContainer">
      <div class="chat-inner" id="chatInner"></div>
    </section>

    <div class="composer-wrap">
      <h1 class="hero">What are we exploring today, <span>Salima</span>?</h1>

      <div class="composer">
        <button class="round-btn" id="attachBtn" title="Upload a document or picture"><svg><use href="#i-plus"/></svg></button>
        <input type="file" id="fileInput" hidden
               accept=".pdf,.docx,.txt,.md,.py,.csv,.xlsx,.pptx,.png,.jpg,.jpeg,.webp">
        <textarea id="messageInput" rows="1" placeholder="Ask SaliBot anything..."></textarea>
        <select id="modelSelect" title="Choose a Gemini model"></select>
        <button class="round-btn" id="micBtn" title="Speak your message"><svg><use href="#i-mic"/></svg></button>
        <button class="round-btn" id="sendBtn" title="Send"><svg><use href="#i-send"/></svg></button>
      </div>

      <div class="suggestions" id="suggestions"></div>

      <div class="notice" id="noticeText">SaliBot can make mistakes. Double-check important information.</div>
    </div>
  </main>

  <script>
    // ---------- Page elements ----------
    const main = document.getElementById("main");
    const chatContainer = document.getElementById("chatContainer");
    const chatInner = document.getElementById("chatInner");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("status");
    const conversationList = document.getElementById("conversationList");
    const modelSelect = document.getElementById("modelSelect");
    const noticeText = document.getElementById("noticeText");
    const micBtn = document.getElementById("micBtn");
    const attachBtn = document.getElementById("attachBtn");
    const fileInput = document.getElementById("fileInput");
    const suggestionsBox = document.getElementById("suggestions");
    const searchBox = document.getElementById("searchBox");
    const searchInput = document.getElementById("searchInput");
    const DEFAULT_NOTICE = noticeText.textContent;
    const isPhone = () => window.matchMedia("(max-width: 760px)").matches;

    const TOOL_LABELS = {
      tavily_search: "🌐 Searching the web",
      calculator: "🧮 Calculating",
      search_uploaded_documents: "📄 Reading your documents",
      remember_this: "💾 Saving to memory",
      recall_memory: "🔍 Checking memory"
    };

    const SUGGESTIONS = [
      { icon: "i-globe", text: "What's new in robotics today?", hint: "Web search" },
      { icon: "i-doc", text: "Summarise a document I upload", hint: "Opens upload", upload: true },
      { icon: "i-brain", text: "Remember that I teach robotics", hint: "Memory" },
      { icon: "i-calc", text: "What is 125 * 48 / 6?", hint: "Calculator" }
    ];

    let isBusy = false;

    // ---------- Small helpers ----------
    function safeGet(key) {
      try { return localStorage.getItem(key); } catch { return null; }
    }
    function safeSet(key, value) {
      try { localStorage.setItem(key, value); } catch {}
    }

    function makeId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    let threadId = safeGet("thread_id") || makeId();
    safeSet("thread_id", threadId);

    function icon(name) {
      return `<svg><use href="#${name}"/></svg>`;
    }

    function renderMarkdown(element, text) {
      if (window.marked && window.DOMPurify) {
        element.innerHTML = DOMPurify.sanitize(marked.parse(text));
      } else {
        element.textContent = text;
        element.style.whiteSpace = "pre-wrap";
      }
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function setBusy(busy, label = "Thinking...") {
      isBusy = busy;
      sendBtn.disabled = busy;
      statusText.textContent = busy ? label : "Ready";
      statusText.classList.toggle("busy", busy);
    }

    function autoResize() {
      // Empty box → back to a single line
      if (!messageInput.value) {
        messageInput.style.height = "";
        return;
      }
      messageInput.style.height = "auto";
      messageInput.style.height = Math.min(messageInput.scrollHeight, 200) + "px";
    }

    // ---------- Start screen ----------
    function showWelcome() {
      chatInner.innerHTML = "";
      main.classList.add("empty");
    }

    function clearWelcome() {
      main.classList.remove("empty");
    }

    function buildSuggestions() {
      SUGGESTIONS.forEach(s => {
        const btn = document.createElement("button");
        btn.className = "suggestion";
        btn.innerHTML = `${icon(s.icon)}<span>${s.text}</span><small>${s.hint}</small>`;
        btn.onclick = () => {
          if (s.upload) { fileInput.click(); return; }
          messageInput.value = s.text;
          sendMessage();
        };
        suggestionsBox.appendChild(btn);
      });
    }

    // ---------- Drawing messages ----------
    function addUserMessage(text) {
      clearWelcome();
      const row = document.createElement("div");
      row.className = "message user";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      const you = document.createElement("div");
      you.className = "avatar you";
      you.textContent = "U";
      row.appendChild(you);
      chatInner.appendChild(row);
      scrollToBottom();
    }

    function addBotMessage(text = "") {
      clearWelcome();
      const row = document.createElement("div");
      row.className = "message bot";
      row.innerHTML = `<div class="avatar">AI</div><div class="bubble"><div class="tools"></div><div class="content"></div></div>`;
      chatInner.appendChild(row);
      const content = row.querySelector(".content");
      if (text) renderMarkdown(content, text);
      scrollToBottom();
      return row;
    }

    function addNote(text, isError = false) {
      clearWelcome();
      const note = document.createElement("div");
      note.className = "system-note" + (isError ? " error" : "");
      renderMarkdown(note, text);
      chatInner.appendChild(note);
      scrollToBottom();
      return note;
    }

    // ---------- Talking to the server ----------
    async function loadModels() {
      try {
        const res = await fetch("/models");
        const data = await res.json();
        modelSelect.innerHTML = "";
        data.models.forEach(m => {
          const option = document.createElement("option");
          option.value = m;
          option.textContent = m;
          modelSelect.appendChild(option);
        });
        const saved = safeGet("selected_model");
        modelSelect.value = data.models.includes(saved) ? saved : data.default;
      } catch (e) {
        noticeText.textContent = "Couldn't load models — is the server running?";
      }
    }

    async function loadConversations() {
      try {
        const res = await fetch("/conversations");
        const data = await res.json();
        const chats = data.conversations || [];
        conversationList.innerHTML = "";

        if (!chats.length) {
          conversationList.innerHTML = `<div class="empty-list">No chats yet — say hi! 👋</div>`;
          return;
        }

        chats.forEach(chat => {
          const btn = document.createElement("button");
          btn.className = "conversation" + (chat.thread_id === threadId ? " active" : "");
          btn.textContent = chat.title || "New chat";
          btn.title = chat.title || "New chat";
          btn.onclick = () => openConversation(chat.thread_id);
          conversationList.appendChild(btn);
        });

        filterConversations();
      } catch (e) {
        conversationList.innerHTML = `<div class="empty-list">Couldn't load chats.</div>`;
      }
    }

    function filterConversations() {
      const query = searchInput.value.trim().toLowerCase();
      conversationList.querySelectorAll(".conversation").forEach(btn => {
        btn.style.display = btn.textContent.toLowerCase().includes(query) ? "" : "none";
      });
    }

    async function loadHistory() {
      chatInner.innerHTML = "";
      try {
        const res = await fetch(`/history/${encodeURIComponent(threadId)}`);
        const data = await res.json();
        const messages = data.messages || [];

        if (!messages.length) { showWelcome(); return; }

        messages.forEach(m => {
          if (m.role === "user") addUserMessage(m.content);
          else if (m.role === "system") addNote(m.content);
          else addBotMessage(m.content);
        });
      } catch (e) {
        showWelcome();
      }
    }

    async function openConversation(id) {
      if (isBusy) return;
      threadId = id;
      safeSet("thread_id", id);
      document.body.classList.remove("sidebar-open");
      await loadHistory();
      await loadConversations();
    }

    function newChat() {
      if (isBusy) return;
      threadId = makeId();
      safeSet("thread_id", threadId);
      showWelcome();
      loadConversations();
      document.body.classList.remove("sidebar-open");
      messageInput.focus();
    }

    async function sendMessage() {
      // Pressing ↑ while recording: stop, write it down, then send
      if (isRecording) { sendAfterTranscribe = true; stopRecording(); return; }
      if (isTranscribing) { sendAfterTranscribe = true; return; }

      const text = messageInput.value.trim();
      if (!text || isBusy) return;

      messageInput.value = "";
      autoResize();
      addUserMessage(text);

      const row = addBotMessage();
      const content = row.querySelector(".content");
      const toolsBox = row.querySelector(".tools");
      content.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
      setBusy(true);

      let reply = "";
      let renderQueued = false;
      const queueRender = () => {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => {
          renderMarkdown(content, reply);
          scrollToBottom();
          renderQueued = false;
        });
      };

      try {
        const res = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, thread_id: threadId, model: modelSelect.value })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          // The server sends events like:  data: {"token": "Hello"}\n\n
          const events = buffer.split("\n\n");
          buffer = events.pop();

          for (const raw of events) {
            const line = raw.trim();
            if (!line.startsWith("data:")) continue;
            const event = JSON.parse(line.slice(5).trim());

            if (event.token) {
              reply += event.token;
              queueRender();
            } else if (event.tool) {
              const label = TOOL_LABELS[event.tool] || `🛠️ Using ${event.tool}`;
              const chip = document.createElement("span");
              chip.className = "tool-chip";
              chip.textContent = label;
              toolsBox.appendChild(chip);
              statusText.textContent = label + "...";
            } else if (event.error) {
              reply += `\n\n⚠️ ${event.error}`;
              queueRender();
            }
          }
        }

        if (!reply) content.textContent = "(No reply — please try again.)";
      } catch (e) {
        content.textContent = "⚠️ Couldn't reach SaliBot. Is the server still running?";
      } finally {
        setBusy(false);
        loadConversations();
        messageInput.focus();
      }
    }

    async function uploadFile(file) {
      if (!file || isBusy) return;
      setBusy(true, `Reading ${file.name}...`);
      const pending = addNote(`⏳ Uploading **${file.name}**...`);

      const form = new FormData();
      form.append("file", file);
      form.append("thread_id", threadId);

      try {
        const res = await fetch("/upload", { method: "POST", body: form });
        const data = await res.json();
        pending.remove();

        if (!res.ok || !data.success) {
          addNote(`⚠️ ${data.message || "Upload failed."}`, true);
        } else {
          addNote(`📎 ${data.message} Ask me about it!`);
        }
      } catch (e) {
        pending.remove();
        addNote("⚠️ Upload failed. Is the server still running?", true);
      } finally {
        setBusy(false);
        fileInput.value = "";
        loadConversations();
      }
    }

    // ---------- 🎤 Voice input: record your voice → Gemini writes it down ----------
    // (More reliable than the browser's speech recognition, which needs
    //  Google's speech servers and can fail silently on some networks.)
    let isRecording = false;
    let isTranscribing = false;
    let sendAfterTranscribe = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let recordTimer = null;

    function pickMimeType() {
      const options = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
      return options.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
    }

    async function startRecording() {
      if (isBusy || isTranscribing) return;

      if (!navigator.mediaDevices || !window.MediaRecorder) {
        alert("Your browser can't record audio. Please use Chrome or Edge.");
        return;
      }

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        alert("SaliBot couldn't use your microphone. Click the icon on the left of the address bar and allow the microphone, then try again.");
        return;
      }

      const mimeType = pickMimeType();
      mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => { if (e.data.size) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(track => track.stop());
        const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        transcribe(blob);
      };

      mediaRecorder.start();
      isRecording = true;
      micBtn.classList.add("recording");
      micBtn.innerHTML = icon("i-stop");
      micBtn.title = "Stop recording";
      noticeText.textContent = "🎙 Recording… click ■ to stop, or ↑ to stop and send.";

      const startedAt = Date.now();
      const tick = () => {
        const s = Math.floor((Date.now() - startedAt) / 1000);
        statusText.textContent = `Recording ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        statusText.classList.add("busy");
      };
      tick();
      recordTimer = setInterval(tick, 500);
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      clearInterval(recordTimer);
      micBtn.classList.remove("recording");
      micBtn.innerHTML = icon("i-mic");
      micBtn.title = "Speak your message";
      mediaRecorder.stop();
    }

    function resetVoiceStatus(message) {
      statusText.textContent = "Ready";
      statusText.classList.remove("busy");
      noticeText.textContent = message || DEFAULT_NOTICE;
    }

    async function transcribe(blob) {
      if (blob.size < 1000) {
        sendAfterTranscribe = false;
        resetVoiceStatus("That recording was too short — hold the mic a little longer.");
        return;
      }

      isTranscribing = true;
      statusText.textContent = "Writing down what you said...";
      statusText.classList.add("busy");
      noticeText.textContent = "✍️ SaliBot is turning your voice into text…";

      const extension = blob.type.includes("ogg") ? "ogg" : blob.type.includes("mp4") ? "m4a" : "webm";
      const form = new FormData();
      form.append("file", blob, `voice.${extension}`);
      form.append("model", modelSelect.value);

      try {
        const res = await fetch("/transcribe", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Couldn't understand the recording.");

        const before = messageInput.value.trim();
        messageInput.value = (before ? before + " " : "") + data.text;
        autoResize();
        resetVoiceStatus();
      } catch (e) {
        sendAfterTranscribe = false;
        resetVoiceStatus("⚠️ " + String(e.message).replace(/\*\*/g, ""));
      } finally {
        isTranscribing = false;
        if (sendAfterTranscribe) {
          sendAfterTranscribe = false;
          sendMessage();
        } else {
          messageInput.focus();
        }
      }
    }

    // ---------- Sidebar ----------
    function closeSidebar() {
      if (isPhone()) document.body.classList.remove("sidebar-open");
      else { document.body.classList.add("sidebar-collapsed"); safeSet("sidebar_collapsed", "1"); }
    }

    function openSidebar() {
      if (isPhone()) document.body.classList.add("sidebar-open");
      else { document.body.classList.remove("sidebar-collapsed"); safeSet("sidebar_collapsed", "0"); }
    }

    if (safeGet("sidebar_collapsed") === "1") document.body.classList.add("sidebar-collapsed");

    // ---------- Buttons & keys ----------
    sendBtn.onclick = sendMessage;
    document.getElementById("newChatBtn").onclick = newChat;
    document.getElementById("uploadSideBtn").onclick = () => fileInput.click();
    document.getElementById("collapseBtn").onclick = closeSidebar;
    document.getElementById("openSidebarBtn").onclick = openSidebar;
    document.getElementById("overlay").onclick = () => document.body.classList.remove("sidebar-open");
    document.getElementById("searchToggle").onclick = () => {
      searchBox.classList.toggle("open");
      if (searchBox.classList.contains("open")) searchInput.focus();
      else { searchInput.value = ""; filterConversations(); }
    };
    searchInput.addEventListener("input", filterConversations);

    attachBtn.onclick = () => fileInput.click();
    fileInput.onchange = () => uploadFile(fileInput.files[0]);
    micBtn.onclick = () => (isRecording ? stopRecording() : startRecording());
    modelSelect.onchange = () => safeSet("selected_model", modelSelect.value);

    messageInput.addEventListener("input", autoResize);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ---------- Start ----------
    buildSuggestions();
    loadModels();
    loadConversations();
    loadHistory();
  </script>
</body>
</html>
